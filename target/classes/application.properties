spring.application.name=careerhub-backend
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:5MB}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload.directory=${UPLOAD_DIRECTORY:./var/uploads/resumes}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin.name=${APP_SEED_ADMIN_NAME:CareerHub Admin}
app.seed.user.email=${APP_SEED_USER_EMAIL:}
app.seed.user.password=${APP_SEED_USER_PASSWORD:}
app.seed.user.name=${APP_SEED_USER_NAME:CareerHub Test User}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
